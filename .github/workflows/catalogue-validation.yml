name: Plugin Catalog validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
      - name: Syntax
        run: |
          find tn-update-controller -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Catalog and package tests
        run: |
          python3 scripts/render-catalogs.py --check
          php tests/catalogue-registry.php
          php tests/catalogue-items.php
          php tests/catalogue-ui.php
          php tests/catalogue-batch.php
